plugins {
    id 'com.android.application'
}

android {
    namespace 'kz.poolaim'
    compileSdk 35

    defaultConfig {
        applicationId 'kz.poolaim'
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName '4.0'
    }

    // Постоянный ключ подписи, чтобы новые версии ставились поверх старых.
    signingConfigs {
        stable {
            storeFile file('poolaim.keystore')
            storePassword 'poolaim-key'
            keyAlias 'poolaim'
            keyPassword 'poolaim-key'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.stable
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
