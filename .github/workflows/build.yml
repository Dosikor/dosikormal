name: Build Pool Aim APK

on:
  push:
    branches: [pool-aim]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        shell: bash
        run: gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build-log.txt

      - name: Publish APK and log to branch apk-out
        if: always()
        shell: bash
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/PoolAim.apk || true
          cp build-log.txt out/ || true
          echo "${{ github.sha }} ${{ job.status }}" > out/status.txt
          cd out
          git init -q
          git checkout -q -b apk-out
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -q -m "build ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" apk-out
